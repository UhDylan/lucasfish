[package]
name = "lucas_fishing"
version = "0.1.0"
edition = "2024"

[profile.dev.package."*"]
opt-level = 3

[features] 
default = []
client = []
steam = []
server = []
debug = []
ui2d = []
ui3d = []

[alias]
server = "run --features server -- server"
client = "run --features client -- client"

[dependencies]
bevy = { version = "0.18.1"}
bevy-steamworks = { version = "0.16", features = ["serde"] }
bevy_panorbit_camera = "0.34.0"
clap = { version = "4.6.1", features = ["derive"] }
serde = "1.0.228"
avian3d = { version = "0.6", features = [
  "3d",
  "f32",
  "parry-f32",
  "parallel",
  "serialize",
]}
lightyear = { git = "https://github.com/cBournhonesque/lightyear", branch = "main", features = [
  "websocket",
  "webtransport",
  "udp",
  "interpolation",
  "prediction",
  "replication",
  "input_bei",
  "avian3d",
  "netcode",
]}
cfg-if = "1.0.4"
